<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprehensive Financial Architecture & Acceleration Hub</title>
    <style>
        :root {
            --primary: #1a73e8;
            --primary-light: #e8f0fe;
            --primary-dark: #1557b0;
            --success: #137333;
            --success-light: #e6f4ea;
            --danger: #c5221f;
            --danger-light: #fce8e6;
            --warning: #b06000;
            --warning-light: #fdf4e7;
            --text-main: #202124;
            --text-muted: #5f6368;
            --bg-app: #f4f6f9;
            --bg-card: #ffffff;
            --border: #dadce0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            color: var(--text-main);
            background-color: var(--bg-app);
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: var(--bg-card);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }

        header {
            margin-bottom: 30px;
            border-bottom: 2px solid #e8eaed;
            padding-bottom: 20px;
        }

        h1 {
            color: var(--primary);
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1em;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .meta-card {
            background-color: var(--bg-app);
            border-left: 4px solid var(--primary);
            padding: 15px 20px;
            border-radius: 4px 8px 8px 4px;
        }

        .meta-card.premium { border-left-color: var(--success); }
        .meta-card.voting { border-left-color: var(--warning); }

        .meta-title {
            font-size: 0.85em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .meta-value {
            font-size: 1.25em;
            font-weight: 700;
            color: var(--text-main);
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 700;
        }
        .badge.success { background-color: var(--success-light); color: var(--success); }
        .badge.danger { background-color: var(--danger-light); color: var(--danger); }
        .badge.warning { background-color: var(--warning-light); color: var(--warning); }

        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
            align-items: start;
        }

        @media (max-width: 1024px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .control-sidebar {
            background-color: var(--bg-app);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .sidebar-title {
            font-size: 1.05em;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--primary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .control-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.88em;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .select-input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.95em;
            background-color: var(--bg-card);
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .select-input:focus {
            border-color: var(--primary);
        }

        .range-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="range"] {
            flex-grow: 1;
            accent-color: var(--primary);
            height: 6px;
            cursor: pointer;
        }

        .val-badge {
            font-family: monospace;
            font-size: 0.9em;
            font-weight: bold;
            background: var(--bg-card);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            min-width: 75px;
            text-align: right;
        }

        .content-area {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .table-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            overflow: hidden;
        }

        .card-header-mix {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .card-subtitle {
            font-size: 1.1em;
            font-weight: 700;
            color: var(--text-main);
        }

        .table-container {
            overflow-x: auto;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88em;
            text-align: right;
        }

        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid #e8eaed;
        }

        th {
            background-color: var(--bg-app);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.82em;
            letter-spacing: 0.5px;
        }

        td:first-child, th:first-child {
            text-align: left;
            font-weight: 500;
        }

        td {
            font-family: monospace;
            font-size: 1.05em;
        }

        .text-label {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .highlight-row {
            background-color: var(--primary-light);
            font-weight: bold;
        }

        .highlight-row td {
            color: var(--primary-dark);
        }

        .neg-val { color: var(--danger); }
        .pos-val { color: var(--success); }

        .interactive-billboard {
            background-color: var(--primary-light);
            border: 1px dashed var(--primary);
            border-radius: 8px;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .billboard-item {
            text-align: center;
        }

        .billboard-lbl {
            font-size: 0.85em;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 4px;
        }

        .billboard-val {
            font-size: 1.35em;
            font-weight: 800;
            font-family: monospace;
        }

        .legal-footer {
            margin-top: 20px;
            font-size: 0.8em;
            color: var(--text-muted);
            line-height: 1.4;
            background-color: #fafafa;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #eee;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Institutional Capital Architecture Hub</h1>
        <div class="subtitle">Singapore Corporate Framework Regulation (ACRA Sec. 64A Compliance)</div>
    </header>

    <div class="meta-grid">
        <div class="meta-card">
            <div class="meta-title">Outstanding Equity Pool</div>
            <div class="meta-value">1,000,000,000,000 <span style="font-size:0.65em; font-weight:500; color:var(--text-muted);">SHARES</span></div>
        </div>
        <div class="meta-card premium">
            <div class="meta-title">Aggregate Valuation</div>
            <div class="meta-value">USD 5,002,070,000,000</div>
        </div>
        <div class="meta-card voting">
            <div class="meta-title">Class Governance Setup</div>
            <div class="meta-value" style="font-size:1.1em; padding-top:2px;">Promoter-Only Class A Voting</div>
        </div>
    </div>

    <div class="main-layout">
        <!-- Input Sidebar Controls -->
        <div class="control-sidebar">
            <div class="sidebar-title">🕹️ Simulation Matrix Parameters</div>
            
            <div class="control-group">
                <label for="modelSelect">Debt Repayment Framework</label>
                <select id="modelSelect" class="select-input">
                    <option value="m1" selected>Model 1: Capitalized Interest</option>
                    <option value="m2">Model 2: Current Servicing</option>
                </select>
            </div>

            <div class="control-group">
                <label for="tierSelect">Active Block Buyer Tier</label>
                <select id="tierSelect" class="select-input">
                    <option value="promoter">Promoters (Class A - Voting)</option>
                    <option value="investor" selected>FII / Open Public (Class B - Non-Voting)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="blockSlider">Simulated Block Size (Millions)</label>
